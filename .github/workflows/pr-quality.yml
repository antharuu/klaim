name: PR quality

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-node24:
    name: Node 24.21.0 / npm 11.19.0
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      npm_config_ignore_scripts: 'true'
      npm_config_engine_strict: 'true'
      npm_config_audit: 'false'
      npm_config_fund: 'false'
      PR_QUALITY_NODE: '24.21.0'
      PR_QUALITY_NPM: '11.19.0'
    defaults:
      run:
        shell: bash
    steps:
      - name: Initialize isolated npm and report paths
        run: |
          report="$RUNNER_TEMP/pr-quality-reports"
          printf 'PR_QUALITY_REPORT_DIR=%s\n' "$report" >> "$GITHUB_ENV"
          printf 'npm_config_userconfig=%s/user.npmrc\n' "$report" >> "$GITHUB_ENV"
          printf 'npm_config_globalconfig=%s/global.npmrc\n' "$report" >> "$GITHUB_ENV"
          printf 'npm_config_cache=%s/npm-cache\n' "$report" >> "$GITHUB_ENV"
          mkdir -p "$report"
          : > "$report/user.npmrc"
          : > "$report/global.npmrc"
      - name: Checkout PR merge SHA without persisted credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, node24; upstream tag verified
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Verify checkout SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Setup exact Node without cache or registry credentials
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0, node24
        with:
          node-version: '24.21.0'
          package-manager-cache: false
          check-latest: false
      - name: Bootstrap exact npm outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/pr-quality-tools" --ignore-scripts --no-audit --no-fund --package-lock=false npm@11.19.0 2>&1 | tee "$PR_QUALITY_REPORT_DIR/bootstrap.log"
          node "$RUNNER_TEMP/pr-quality-tools/node_modules/npm/bin/npm-cli.js" --version | tee "$PR_QUALITY_REPORT_DIR/npm-bootstrap-version.log"
      - name: C1-C10 locked quality contract
        env:
          npm_execpath: ${{ runner.temp }}/pr-quality-tools/node_modules/npm/bin/npm-cli.js
        run: node scripts/pr-quality.mjs
      - name: Negative contract controls
        env:
          npm_execpath: ${{ runner.temp }}/pr-quality-tools/node_modules/npm/bin/npm-cli.js
        run: node scripts/pr-quality-selftest.mjs
      - name: Upload untrusted diagnostic reports only
        if: ${{ always() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0, node24
        with:
          name: pr-quality-node24.21.0-npm11.19.0-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: false
          path: |
            ${{ runner.temp }}/pr-quality-reports/*.log
            ${{ runner.temp }}/pr-quality-reports/*.json
            coverage/coverage-summary.json
            coverage/lcov.info
            coverage/**/*.html
            coverage/**/*.css
            coverage/**/*.js
            coverage/**/*.png

  verify-node22:
    name: Node 22.13.0 / npm 11.19.0
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      npm_config_ignore_scripts: 'true'
      npm_config_engine_strict: 'true'
      npm_config_audit: 'false'
      npm_config_fund: 'false'
      PR_QUALITY_NODE: '22.13.0'
      PR_QUALITY_NPM: '11.19.0'
    defaults:
      run:
        shell: bash
    steps:
      - name: Initialize isolated npm and report paths
        run: |
          report="$RUNNER_TEMP/pr-quality-reports"
          printf 'PR_QUALITY_REPORT_DIR=%s\n' "$report" >> "$GITHUB_ENV"
          printf 'npm_config_userconfig=%s/user.npmrc\n' "$report" >> "$GITHUB_ENV"
          printf 'npm_config_globalconfig=%s/global.npmrc\n' "$report" >> "$GITHUB_ENV"
          printf 'npm_config_cache=%s/npm-cache\n' "$report" >> "$GITHUB_ENV"
          mkdir -p "$report"
          : > "$report/user.npmrc"
          : > "$report/global.npmrc"
      - name: Checkout PR merge SHA without persisted credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, node24; upstream tag verified
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Verify checkout SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Setup exact Node without cache or registry credentials
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0, node24
        with:
          node-version: '22.13.0'
          package-manager-cache: false
          check-latest: false
      - name: Bootstrap exact npm outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/pr-quality-tools" --ignore-scripts --no-audit --no-fund --package-lock=false npm@11.19.0 2>&1 | tee "$PR_QUALITY_REPORT_DIR/bootstrap.log"
          node "$RUNNER_TEMP/pr-quality-tools/node_modules/npm/bin/npm-cli.js" --version | tee "$PR_QUALITY_REPORT_DIR/npm-bootstrap-version.log"
      - name: C1-C10 locked quality contract
        env:
          npm_execpath: ${{ runner.temp }}/pr-quality-tools/node_modules/npm/bin/npm-cli.js
        run: node scripts/pr-quality.mjs
      - name: Negative contract controls
        env:
          npm_execpath: ${{ runner.temp }}/pr-quality-tools/node_modules/npm/bin/npm-cli.js
        run: node scripts/pr-quality-selftest.mjs
      - name: Upload untrusted diagnostic reports only
        if: ${{ always() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0, node24
        with:
          name: pr-quality-node22.13.0-npm11.19.0-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: false
          path: |
            ${{ runner.temp }}/pr-quality-reports/*.log
            ${{ runner.temp }}/pr-quality-reports/*.json
            coverage/coverage-summary.json
            coverage/lcov.info
            coverage/**/*.html
            coverage/**/*.css
            coverage/**/*.js
            coverage/**/*.png

  required:
    name: required
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    needs: [verify-node24, verify-node22]
    if: ${{ always() }}
    steps:
      - name: Fail closed on missing, failed, skipped or cancelled legs
        env:
          NODE24_RESULT: ${{ needs.verify-node24.result }}
          NODE22_RESULT: ${{ needs.verify-node22.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$NODE24_RESULT" = success
          test "$NODE22_RESULT" = success
